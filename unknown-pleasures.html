<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unknown Pleasures</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #caption {
            position: fixed;
            left: 16px;
            bottom: 12px;
            color: rgba(255, 255, 255, 0.22);
            font-family: Verdana, sans-serif;
            font-size: 12px;
            letter-spacing: 0.04em;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>

<body>
    <canvas id="stage"></canvas>
    <div id="caption">PSR B1919+21 (after Joy Division)</div>

    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        let W, H, DPR;

        function resize() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W * DPR;
            canvas.height = H * DPR;
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // ---------------------------------------------------------------
        // Tiny value-noise helpers (same approach as /visualizations.html)
        // ---------------------------------------------------------------
        function hash(n) {
            const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return s - Math.floor(s);
        }

        function noise1(x) {
            const i = Math.floor(x), f = x - i;
            const u = f * f * (3 - 2 * f);
            return hash(i) * (1 - u) + hash(i + 1) * u;
        }

        function fbm1(x, octaves) {
            let sum = 0, amp = 0.5, freq = 1, norm = 0;
            for (let o = 0; o < octaves; o++) {
                sum += amp * noise1(x * freq);
                norm += amp;
                amp *= 0.5;
                freq *= 2.1;
            }
            return sum / norm;
        }

        // ---------------------------------------------------------------
        // Each row is its own animated "scan": a handful of discrete,
        // mountain-shaped peaks (not a continuous noise texture) whose
        // centers/widths are fixed per row and whose heights breathe over
        // time, independently per row/peak. Tallest peaks cluster near the
        // vertical/horizontal center, like the source image. Rows are drawn
        // top-to-bottom; each row's fill occludes whatever earlier (upper)
        // rows drew beneath its curve, producing the classic overlapping-
        // ridge look.
        // ---------------------------------------------------------------
        const ROWS = 70;
        const SAMPLES = 220;
        const rowSeeds = [];
        for (let i = 0; i < ROWS; i++) rowSeeds.push(Math.random() * 1000);

        let t = 0;
        const SPEED = 0.0042; // pace of the peak fluctuation -- tune to taste

        const ACTIVE_HALF = 0.17; // half-width (fraction of chart width) of the full-amplitude center zone
        const ACTIVE_FALLOFF = 0.1; // width of the transition band outside that zone

        // Build this row's peaks: positions/widths are stable (derived from
        // the row seed), only height breathes with t, so the overall
        // silhouette stays coherent while still animating.
        function rowPeaks(seed, t) {
            const count = 3 + Math.floor(hash(seed * 0.731) * 4); // 3..6 peaks
            const peaks = [];
            for (let k = 0; k < count; k++) {
                const kSeed = seed * 1.7 + k * 5.37;
                const centerJitter = hash(kSeed) * 2 - 1; // -1..1
                const center = 0.5 + centerJitter * ACTIVE_HALF * 0.85;
                const width = 0.022 + hash(kSeed + 2.1) * 0.032;
                const baseHeight = 0.5 + hash(kSeed + 4.4) * 0.5;
                const phase = seed * 3 + k * 7.9;
                const breathe = 0.45 + 0.55 * fbm1(t * 0.9 + phase, 2);
                peaks.push({ center, width, height: baseHeight * breathe });
            }
            return peaks;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);

            const marginTop = H * 0.12;
            const chartH = H * 0.76;
            const spacing = chartH / (ROWS - 1);
            const marginX = W * 0.08;
            const chartW = W - marginX * 2;
            const maxPeak = spacing * 11.5;

            for (let i = 0; i < ROWS; i++) {
                const baseline = marginTop + i * spacing;
                const seed = rowSeeds[i];
                const peaks = rowPeaks(seed, t);

                const pts = [];
                for (let s = 0; s <= SAMPLES; s++) {
                    const xn = s / SAMPLES; // 0..1
                    const x = marginX + xn * chartW;

                    // Smooth-sided mountain shape: union of the row's
                    // peaks, each a tent curve softened with a sub-1 power
                    // so the flanks bulge outward instead of scooping in.
                    let amp01 = 0;
                    for (const p of peaks) {
                        const d = Math.abs(xn - p.center);
                        if (d < p.width) {
                            const tent = 1 - d / p.width;
                            const shaped = Math.pow(tent, 0.95) * p.height;
                            if (shaped > amp01) amp01 = shaped;
                        }
                    }
                    const amp = amp01 * maxPeak;

                    // Small animated hand-drawn jitter, present across the
                    // whole line (including the flat outer stretches) so
                    // nothing is ever perfectly straight. Two layers at
                    // different frequencies give a grainier, more analog
                    // texture than a single smooth wobble.
                    const jitter =
                        (noise1(xn * 90 + seed * 13.7 + t * 2.2) - 0.5) * spacing * 0.09 +
                        (noise1(xn * 260 + seed * 31.4 + t * 4.1) - 0.5) * spacing * 0.11;

                    pts.push([x, baseline - amp + jitter]);
                }

                // Occluding fill: blacks out anything earlier rows drew
                // beneath this row's curve.
                ctx.beginPath();
                ctx.moveTo(pts[0][0], baseline + spacing);
                for (const [x, y] of pts) ctx.lineTo(x, y);
                ctx.lineTo(pts[pts.length - 1][0], baseline + spacing);
                ctx.closePath();
                ctx.fillStyle = '#000';
                ctx.fill();

                // Stroke the line itself.
                ctx.beginPath();
                ctx.moveTo(pts[0][0], pts[0][1]);
                for (const [x, y] of pts) ctx.lineTo(x, y);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.1;
                ctx.stroke();
            }

            t += SPEED;
            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>
</body>

</html>
