<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unknown Pleasures</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #caption {
            position: fixed;
            left: 16px;
            bottom: 12px;
            color: rgba(255, 255, 255, 0.22);
            font-family: Verdana, sans-serif;
            font-size: 12px;
            letter-spacing: 0.04em;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>

<body>
    <canvas id="stage"></canvas>
    <div id="caption">PSR B1919+21 (after Joy Division)</div>

    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        let W, H, DPR;

        function resize() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W * DPR;
            canvas.height = H * DPR;
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // ---------------------------------------------------------------
        // Tiny value-noise helpers (same approach as /visualizations.html)
        // ---------------------------------------------------------------
        function hash(n) {
            const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return s - Math.floor(s);
        }

        function noise1(x) {
            const i = Math.floor(x), f = x - i;
            const u = f * f * (3 - 2 * f);
            return hash(i) * (1 - u) + hash(i + 1) * u;
        }

        function fbm1(x, octaves) {
            let sum = 0, amp = 0.5, freq = 1, norm = 0;
            for (let o = 0; o < octaves; o++) {
                sum += amp * noise1(x * freq);
                norm += amp;
                amp *= 0.5;
                freq *= 2.1;
            }
            return sum / norm;
        }

        // ---------------------------------------------------------------
        // Each row is its own animated "scan": a cluster of sharp spikes
        // whose heights slowly fluctuate over time, independently per row.
        // Tallest peaks cluster near the vertical/horizontal center, like
        // the source image. Rows are drawn top-to-bottom; each row's fill
        // occludes whatever earlier (upper) rows drew beneath its curve,
        // producing the classic overlapping-ridge look.
        // ---------------------------------------------------------------
        const ROWS = 70;
        const SAMPLES = 220;
        const rowSeeds = [];
        for (let i = 0; i < ROWS; i++) rowSeeds.push(Math.random() * 1000);

        let t = 0;
        const SPEED = 0.028; // pace of the peak fluctuation -- tune to taste

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);

            const marginTop = H * 0.12;
            const chartH = H * 0.76;
            const spacing = chartH / (ROWS - 1);
            const marginX = W * 0.08;
            const chartW = W - marginX * 2;
            const maxPeak = spacing * 11;
            const ACTIVE_HALF = 0.17; // half-width (fraction of chart width) of the full-amplitude center zone
            const ACTIVE_FALLOFF = 0.1; // width of the transition band outside that zone

            for (let i = 0; i < ROWS; i++) {
                const baseline = marginTop + i * spacing;
                const seed = rowSeeds[i];

                const pts = [];
                for (let s = 0; s <= SAMPLES; s++) {
                    const xn = s / SAMPLES; // 0..1
                    const x = marginX + xn * chartW;
                    const xDist = Math.abs(xn - 0.5);
                    let xEnv;
                    if (xDist <= ACTIVE_HALF) {
                        xEnv = 1;
                    } else if (xDist >= ACTIVE_HALF + ACTIVE_FALLOFF) {
                        xEnv = 0;
                    } else {
                        const u = (xDist - ACTIVE_HALF) / ACTIVE_FALLOFF;
                        xEnv = 1 - u * u * (3 - 2 * u); // smoothstep falloff
                    }

                    const cluster = fbm1(xn * 6 + seed * 3.1 + t * 0.8, 2);
                    const fine = noise1(xn * 55 + seed * 9.7 + t * 1.6);
                    const slow = fbm1(seed * 5 + t + xn * 1.3, 2);

                    const spike = Math.pow(Math.max(0, fine * cluster), 2.1);
                    const mod = 0.35 + 0.65 * slow;
                    const amp = spike * mod * xEnv * maxPeak;

                    // Small animated hand-drawn jitter, present across the
                    // whole line (including the flat outer stretches) so
                    // nothing is ever perfectly straight.
                    const jitter = (noise1(xn * 90 + seed * 13.7 + t * 2.2) - 0.5) * spacing * 0.12;

                    pts.push([x, baseline - amp + jitter]);
                }

                // Occluding fill: blacks out anything earlier rows drew
                // beneath this row's curve.
                ctx.beginPath();
                ctx.moveTo(pts[0][0], baseline + spacing);
                for (const [x, y] of pts) ctx.lineTo(x, y);
                ctx.lineTo(pts[pts.length - 1][0], baseline + spacing);
                ctx.closePath();
                ctx.fillStyle = '#000';
                ctx.fill();

                // Stroke the line itself.
                ctx.beginPath();
                ctx.moveTo(pts[0][0], pts[0][1]);
                for (const [x, y] of pts) ctx.lineTo(x, y);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.1;
                ctx.stroke();
            }

            t += SPEED;
            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>
</body>

</html>
