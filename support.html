<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Support</title>
    <style>
        :root { --bg:#f7f9fc; --card:#fff; --muted:#6b7280; --accent:#0b5fff; font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:#0f1724; }
        .card { width:clamp(280px,54vw,720px); background:var(--card); padding:28px; box-shadow:0 6px 24px rgba(15,23,36,0.08); border-radius:12px; }
        h1 { margin:0 0 6px; font-size:1.25rem; }
        p { margin:0 0 16px; color:var(--muted); }
        a.mail { display:inline-block; padding:10px 14px; background:var(--accent); color:#fff; border-radius:8px; text-decoration:none; font-weight:600; }
        small { display:block; margin-top:12px; color:var(--muted); }
    </style>
</head>
<body>
    <main class="card" role="main" aria-labelledby="support-heading">
        <h1 id="support-heading">Support</h1>
        <p>For any and all support issues, please send an email to the address below. Include a clear description, steps to reproduce, and any relevant screenshots or logs.</p>
        <a class="mail" href="mailto:jeffphi@gmail.com?subject=Support%20Request">jeffphi@gmail.com</a>
        <small>Typical response time: variable. This is the primary way to request help.</small>
    </main>
</body>
</html>
