<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prints</title>
  <meta name="description" content="Printmaking from a class." />
  <link rel="icon" href="/assets/Profile-J.jpg" />
  <style>
    :root {
      --bg: #111;
      --text: #ececec;
      --muted: #9a9a9a;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.6rem;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid {
      columns: 2 280px;
      column-gap: 14px;
    }

    .grid a {
      display: block;
      break-inside: avoid;
      margin-bottom: 14px;
    }

    .grid img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: #1c1c1c;
      transition: transform 0.2s ease;
    }

    .grid a:hover img {
      transform: scale(1.01);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }

    .lightbox-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 2.2rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 10px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Prints</h1>
    <p class="subtitle">Work from a printmaking class I took at North Seattle Community College during our year off work (2012). Click any print to see it full-size.</p>

    <div class="grid">
      <a href="jeff-prints/print-1.jpg"><img src="jeff-prints/print-1.jpg" alt="Print 1" loading="lazy" /></a>
      <a href="jeff-prints/print-2.jpg"><img src="jeff-prints/print-2.jpg" alt="Print 2" loading="lazy" /></a>
      <a href="jeff-prints/print-3.jpg"><img src="jeff-prints/print-3.jpg" alt="Print 3" loading="lazy" /></a>
      <a href="jeff-prints/print-4.jpg"><img src="jeff-prints/print-4.jpg" alt="Print 4" loading="lazy" /></a>
      <a href="jeff-prints/print-5.jpg"><img src="jeff-prints/print-5.jpg" alt="Print 5" loading="lazy" /></a>
      <a href="jeff-prints/print-6.jpg"><img src="jeff-prints/print-6.jpg" alt="Print 6" loading="lazy" /></a>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Print viewer">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close">&times;</button>
    <img id="lightbox-img" alt="" />
  </div>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");

    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt;
      lightbox.classList.add("open");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImg.removeAttribute("src");
    }

    document.querySelectorAll(".grid a").forEach((link) => {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        openLightbox(link.getAttribute("href"), link.querySelector("img").alt);
      });
    });

    document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });
  </script>
</body>

</html>
