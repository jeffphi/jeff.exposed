<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prints</title>
  <meta name="description" content="Printmaking from a class." />
  <link rel="icon" href="/assets/Profile-J.jpg" />
  <style>
    :root {
      --bg: #111;
      --text: #ececec;
      --muted: #9a9a9a;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.6rem;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid {
      columns: 2 280px;
      column-gap: 14px;
    }

    .grid a {
      display: block;
      break-inside: avoid;
      margin-bottom: 14px;
    }

    .grid img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: #1c1c1c;
      transition: transform 0.2s ease;
    }

    .grid a:hover img {
      transform: scale(1.01);
    }
  </style>
</head>

<body>
  <main>
    <h1>Prints</h1>
    <p class="subtitle">Work from a printmaking class. Click any print to see it full-size.</p>

    <div class="grid">
      <a href="jeff-prints/print-1.jpg"><img src="jeff-prints/print-1.jpg" alt="Print 1" loading="lazy" /></a>
      <a href="jeff-prints/print-2.jpg"><img src="jeff-prints/print-2.jpg" alt="Print 2" loading="lazy" /></a>
      <a href="jeff-prints/print-3.jpg"><img src="jeff-prints/print-3.jpg" alt="Print 3" loading="lazy" /></a>
      <a href="jeff-prints/print-4.jpg"><img src="jeff-prints/print-4.jpg" alt="Print 4" loading="lazy" /></a>
      <a href="jeff-prints/print-5.jpg"><img src="jeff-prints/print-5.jpg" alt="Print 5" loading="lazy" /></a>
      <a href="jeff-prints/print-6.jpg"><img src="jeff-prints/print-6.jpg" alt="Print 6" loading="lazy" /></a>
    </div>
  </main>
</body>

</html>
